name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          check-latest: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./cmd/toolgit
        
      - name: Run Tests
        # Skip tests that require PowerShell or are incompatible with shallow clones
        run: go test -v -skip "^(TestUserJourneySimulation|TestRealRepoUserWorkflow|TestComprehensiveRealRepoWorkflow|TestGitIntegrationAndRewrite)$" ./...
